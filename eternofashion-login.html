<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Eterno Fashion</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { 
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; 
      background: #050508; overflow: hidden;
    }
    /* Centered Glass Card */
    .login-card {
      width: 100%; max-width: 420px;
      padding: 40px;
      background: rgba(15, 15, 25, 0.7);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
      z-index: 10;
      animation: fadeInUp 0.6s var(--ease) both;
    }
    .mesh-bg { position: fixed; inset: 0; z-index: 0; }
    .mesh-orb {
      position: absolute; border-radius: 50%; filter: blur(120px);
      opacity: 0.5; animation: meshFlow 15s infinite alternate;
    }
    @keyframes meshFlow { 0%{transform:translate(0,0);} 100%{transform:translate(10%,10%);} }
    
    .tab-nav { display: flex; gap: 4px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 12px; margin-bottom: 30px; }
    .tab-nav button { 
      flex: 1; padding: 10px; border-radius: 9px; cursor: pointer; border: none; background: none; 
      color: #777; font-weight: 600; font-family: var(--font-heading); transition: 0.3s;
    }
    .tab-nav button.active { background: var(--gradient); color: white; box-shadow: 0 10px 20px rgba(255,0,110,0.2); }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .input-row { position: relative; }
    .input-row input { 
      width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 12px; padding: 14px 16px; color: white; transition: 0.3s;
    }
    .input-row input:focus { border-color: var(--blue); outline: none; background: rgba(58,134,255,0.05); box-shadow: 0 0 15px rgba(58,134,255,0.1); }
    
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>

  <!-- Animated Mesh -->
  <div class="mesh-bg">
    <div class="mesh-orb" style="background:var(--pink); width:500px; height:500px; top:-10%; left:-10%;"></div>
    <div class="mesh-orb" style="background:var(--blue); width:400px; height:400px; bottom:-10%; right:-10%;"></div>
  </div>

  <div class="login-card">
    <div style="text-align: center; margin-bottom: 34px;">
      <a href="eternofashion-index.html" class="nav-logo" style="justify-content: center;">
        <span class="logo-text">Eterno</span>
        <span class="logo-sub">Fashion</span>
      </a>
    </div>

    <div class="tab-nav">
      <button id="btnSign" class="active" onclick="toggle('sign')">Login</button>
      <button id="btnReg" onclick="toggle('reg')">Register</button>
    </div>

    <!-- Login Panel -->
    <div id="panelSign" class="panel active">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-row"><input type="email" id="email" placeholder="you@example.com"></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-row"><input type="password" id="pass" placeholder="••••••••"></div>
      </div>
      <button class="btn btn-neon" style="width:100%; padding:14px; margin-top:10px;" onclick="handleAuth('in')">Sign In ⚡</button>
    </div>

    <!-- Register Panel -->
    <div id="panelReg" class="panel">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-row"><input type="email" id="emailReg" placeholder="you@example.com"></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-row"><input type="password" id="passReg" placeholder="min. 8 characters"></div>
      </div>
      <button class="btn btn-neon" style="width:100%; padding:14px; margin-top:10px;" onclick="handleAuth('up')">Create Account ✨</button>
    </div>

    <div style="margin-top:24px; text-align:center;">
      <a href="eternofashion-shop.html" style="font-size:0.85rem; color:#666; text-decoration:none;">Browse without an account</a>
    </div>
  </div>

  <div id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    function toggle(mode) {
      document.getElementById('btnSign').classList.toggle('active', mode === 'sign');
      document.getElementById('btnReg').classList.toggle('active', mode === 'reg');
      document.getElementById('panelSign').classList.toggle('active', mode === 'sign');
      document.getElementById('panelReg').classList.toggle('active', mode === 'reg');
    }

    async function handleAuth(type) {
      const isUp = type === 'up';
      const email = document.getElementById(isUp ? 'emailReg' : 'email').value.trim();
      const pass = document.getElementById(isUp ? 'passReg' : 'pass').value;

      if (!email || !pass) return showToast('Please enter credentials', 'error');

      const btn = document.querySelector('.panel.active .btn');
      const originalText = btn.textContent;
      btn.disabled = true; btn.textContent = 'Processing...';

      try {
        let authResult;
        if (isUp) {
          authResult = await window.db.auth.signUp({ 
            email, password: pass,
            options: { emailRedirectTo: window.location.href }
          });
          if (!authResult.error) {
            // MANUALLY create profile on signup to ensure it exists
            await window.db.from('profiles').upsert({ id: authResult.data.user.id, email: email, role: 'customer' });
            showToast('Account created! Sign in now.', 'success');
            toggle('sign');
          }
        } else {
          authResult = await window.db.auth.signInWithPassword({ email, password: pass });
          if (!authResult.error) {
            showToast('Success!', 'success');
            const user = authResult.data.user;
            // Check role and redirect
            const { data: profile } = await window.db.from('profiles').select('role').eq('id', user.id).single();
            setTimeout(() => {
              window.location.href = profile?.role === 'admin' ? getPath('eternofashion-admin.html') : getPath('eternofashion-shop.html');
            }, 800);
          }
        }

        if (authResult.error) showToast(authResult.error.message, 'error');
      } catch (err) {
        showToast('Auth error occurred', 'error');
      } finally {
        btn.disabled = false; btn.textContent = originalText;
      }
    }
  </script>
</body>
</html>
