<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eterno | Secure Access</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #08080c; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: white; }
    .card { background: #12121a; border: 1px solid #222; border-radius: 20px; padding: 40px; width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .input-box { width: 100%; background: #1c1c24; border: 1px solid #333; padding: 12px; border-radius: 8px; color: white; margin-bottom: 20px; box-sizing: border-box; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: linear-gradient(to right, #ff006e, #3a86ff); color: white; }
    .btn-primary:disabled { opacity: 0.5; }
    .tab { border-bottom: 2px solid #222; margin-bottom: 30px; display: flex; cursor: pointer; }
    .tab div { flex: 1; text-align: center; padding: 10px; color: #555; }
    .tab div.active { color: white; border-bottom: 2px solid #ff006e; }
    #msg { padding: 12px; border-radius: 6px; font-size: 0.85rem; margin-top: 20px; display: none; }
    #msg.err { background: #421111; color: #ff8888; border: 1px solid #662222; }
    #msg.ok { background: #113322; color: #88ffaa; border: 1px solid #225533; }
  </style>
</head>
<body>

  <div class="card">
    <div style="text-align: center; margin-bottom: 30px;">
      <h1 style="margin:0; font-family: 'Space Grotesk', sans-serif;">Eterno</h1>
      <p style="color:#555; font-size: 0.8rem; letter-spacing: 2px;">AUTHENTICATION</p>
    </div>

    <div class="tab">
      <div id="tabIn" class="active" onclick="setMode('in')">Login</div>
      <div id="tabUp" onclick="setMode('up')">Sign Up</div>
    </div>

    <input type="email" id="email" class="input-box" placeholder="Email Address">
    <input type="password" id="pass" class="input-box" placeholder="Password">
    
    <button id="mainBtn" class="btn btn-primary" onclick="handleAuth()">Sign In</button>
    
    <div id="msg"></div>

    <div style="margin-top: 30px; text-align: center; font-size: 0.8rem;">
      <a href="https://www.knowyourproducts.in/eternofashion-index.html" style="color: #444; text-decoration: none;">← Back to Home</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    let mode = 'in';

    function setMode(m) {
      mode = m;
      document.getElementById('tabIn').className = m === 'in' ? 'active' : '';
      document.getElementById('tabUp').className = m === 'up' ? 'active' : '';
      document.getElementById('mainBtn').textContent = m === 'in' ? 'Sign In' : 'Create Account';
      hideMsg();
    }

    function showMsg(txt, type) {
      const el = document.getElementById('msg');
      el.textContent = txt;
      el.className = type === 'err' ? 'err' : 'ok';
      el.style.display = 'block';
    }

    function hideMsg() { document.getElementById('msg').style.display = 'none'; }

    async function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      const btn = document.getElementById('mainBtn');

      if (!email || !pass) return showMsg('Email and Password required.', 'err');

      btn.disabled = true;
      btn.textContent = 'Connecting to Supabase...';
      hideMsg();

      try {
        if (mode === 'up') {
          // SIGN UP
          const { data, error } = await window.db.auth.signUp({ email, password: pass });
          if (error) throw error;
          
          if (data.user) {
             showMsg('Success! Account created. You can now log in.', 'ok');
             setMode('in');
          }
        } else {
          // LOGIN
          const { data, error } = await window.db.auth.signInWithPassword({ email, password: pass });
          if (error) throw error;

          showMsg('Success! Redirecting...', 'ok');
          
          // Check role and redirect
          const { data: profile } = await window.db.from('profiles').select('role').eq('id', data.user.id).single();
          
          setTimeout(() => {
            window.location.href = profile?.role === 'admin' ? getPath('eternofashion-admin.html') : getPath('eternofashion-shop.html');
          }, 800);
        }
      } catch (err) {
        console.error(err);
        showMsg(err.message || 'Unknown error occurred.', 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = mode === 'in' ? 'Sign In' : 'Create Account';
      }
    }
  </script>
</body>
</html>
