<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Eterno Fashion</title>
  <meta name="description" content="Your shopping cart at Eterno Fashion. Review your selected pieces and proceed to checkout.">
  <link rel="canonical" href="https://www.knowyourproducts.in/eternofashion-cart.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fade">

  <!-- SCROLL TO TOP -->
  <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="https://www.knowyourproducts.in/eternofashion-index.html" class="nav-logo">
        <span class="logo-text">Eterno</span>
        <span class="logo-sub">Fashion</span>
      </a>
      <ul class="nav-links">
        <li><a href="https://www.knowyourproducts.in/eternofashion-index.html" class="nav-link">Home</a></li>
        <li><a href="https://www.knowyourproducts.in/eternofashion-shop.html" class="nav-link">Shop</a></li>
      </ul>
      <div class="nav-actions">
        <a href="https://www.knowyourproducts.in/eternofashion-cart.html" class="nav-cart" title="Cart" style="color:var(--gold);">
          🛒
          <span class="cart-badge" id="cartBadge" style="display:none">0</span>
        </a>
        <button class="btn btn-outline" id="logoutBtn" style="display:none">Sign Out</button>
      </div>
    </div>
  </nav>

  <!-- CART PAGE -->
  <div class="cart-page">
    <div class="cart-page-inner">
      <div id="cartContent">
        <div class="loading-state" style="padding:120px 0;">
          <div class="spinner"></div>
          <p>Loading your cart...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ORDER CONFIRMATION MODAL -->
  <div class="modal-overlay" id="orderModal" style="display:none;">
    <div class="modal">
      <span class="modal-icon">🎉</span>
      <h2>Order Confirmed!</h2>
      <p>
        Thank you for shopping at Eterno Fashion!<br>
        Our team will contact you shortly with delivery details.<br><br>
        <strong style="color:var(--gold);font-size:1.1rem;" id="orderTotal"></strong>
      </p>
      <div class="modal-actions">
        <a href="https://www.knowyourproducts.in/eternofashion-shop.html" class="btn btn-gold">Continue Shopping</a>
        <a href="https://www.knowyourproducts.in/eternofashion-index.html" class="btn btn-outline">Go Home</a>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/interactive.js"></script>
  <script src="js/cart.js"></script>
  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('scrollTop')?.classList.toggle('visible', window.scrollY > 200);
    }, { passive: true });
  </script>
</body>
</html>
