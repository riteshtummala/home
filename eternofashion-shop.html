<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Eterno Fashion</title>
  <meta name="description" content="Browse our curated collection of sustainable thrift fashion. Find unique, affordable pieces at Eterno Fashion.">
  <link rel="canonical" href="https://www.knowyourproducts.in/eternofashion-shop.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-fade">

  <!-- SCROLL TO TOP -->
  <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">↑</button>

  <!-- MOBILE FLOAT CART -->
  <button class="float-cart" onclick="window.location.href='https://www.knowyourproducts.in/eternofashion-cart.html'">
    🛒 <span id="floatCartCount">Cart</span>
  </button>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="https://www.knowyourproducts.in/eternofashion-index.html" class="nav-logo">
        <span class="logo-text">Eterno</span>
        <span class="logo-sub">Fashion</span>
      </a>
      <ul class="nav-links">
        <li><a href="https://www.knowyourproducts.in/eternofashion-index.html" class="nav-link">Home</a></li>
        <li><a href="https://www.knowyourproducts.in/eternofashion-shop.html" class="nav-link active">Shop</a></li>
      </ul>
      <div class="nav-actions">
        <a href="https://www.knowyourproducts.in/eternofashion-cart.html" class="nav-cart" title="Cart">
          🛒
          <span class="cart-badge" id="cartBadge" style="display:none">0</span>
        </a>
        <a href="https://www.knowyourproducts.in/eternofashion-login.html" class="btn btn-gold" id="loginBtn" style="display:none">Sign In</a>
        <button class="btn btn-outline" id="logoutBtn" style="display:none">Sign Out</button>
      </div>
    </div>
  </nav>

  <!-- SHOP HEADER -->
  <div class="shop-page">
    <div class="shop-header">
      <div class="shop-title-area">
        <h1>Our Collection</h1>
        <p id="productCount">Loading items...</p>
      </div>
      <div class="shop-controls">
        <input
          type="search"
          class="search-input"
          id="searchInput"
          placeholder="🔍  Search pieces..."
          oninput="filterProducts()"
        >
        <select class="filter-select" id="sortFilter" onchange="filterProducts()">
          <option value="newest">Newest First</option>
          <option value="price_asc">Price: Low → High</option>
          <option value="price_desc">Price: High → Low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </div>

    <!-- CATEGORY CHIPS -->
    <div class="category-chips" id="categoryChips">
      <button class="cat-chip active" onclick="setCategory('')" data-cat="">✨ All</button>
      <button class="cat-chip" onclick="setCategory('Tops')" data-cat="Tops">👚 Tops</button>
      <button class="cat-chip" onclick="setCategory('Bottoms')" data-cat="Bottoms">👖 Bottoms</button>
      <button class="cat-chip" onclick="setCategory('Dresses')" data-cat="Dresses">👗 Dresses</button>
      <button class="cat-chip" onclick="setCategory('Outerwear')" data-cat="Outerwear">🧥 Outerwear</button>
      <button class="cat-chip" onclick="setCategory('Accessories')" data-cat="Accessories">💍 Accessories</button>
      <button class="cat-chip" onclick="setCategory('Shoes')" data-cat="Shoes">👟 Shoes</button>
      <button class="cat-chip" onclick="setCategory('Bags')" data-cat="Bags">👜 Bags</button>
      <button class="cat-chip" onclick="setCategory('Other')" data-cat="Other">🏷 Other</button>
    </div>

    <!-- PRODUCTS GRID -->
    <div class="products-grid" id="productsGrid" style="max-width:1300px;margin:0 auto;padding:0 5% 80px;">
      <!-- skeleton loaded by JS -->
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="interactive.js"></script>
  <script src="shop.js"></script>
  <script>
    // Scroll to top / float cart visibility
    window.addEventListener('scroll', () => {
      document.getElementById('scrollTop')?.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });
  </script>
</body>
</html>
